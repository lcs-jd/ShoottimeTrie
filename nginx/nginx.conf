events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  client_max_body_size 150m;
  proxy_read_timeout   300s;
  proxy_send_timeout   300s;
  proxy_connect_timeout 10s;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Masquer la version de nginx dans les en-têtes et pages d'erreur
  server_tokens off;

  server {
    listen 80;
    server_name _;

    # En-têtes de sécurité (le backend pose les siens sur /api et /media)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Bloquer l'accès aux fichiers cachés
    location ~ /\. { deny all; }

    # SSE : désactiver le buffering
    location /api/sessions/events {
      proxy_pass         http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 86400s;
      chunked_transfer_encoding on;
    }

    location ~ ^/api/sessions/[^/]+/events {
      proxy_pass         http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   Cookie $http_cookie;
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 86400s;
      chunked_transfer_encoding on;
    }

    # API
    location /api/ {
      proxy_pass         http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   Cookie $http_cookie;
      proxy_pass_header  Set-Cookie;
    }

    # Fichiers media servis par le backend.
    # Les photos sont privées (authentification exigée côté backend) : le cache
    # doit rester propre au navigateur du visiteur, jamais partagé/public.
    location /media/ {
      proxy_pass         http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   Cookie $http_cookie;
      add_header         Cache-Control "private, max-age=3600" always;
      add_header         X-Content-Type-Options nosniff always;
    }

    # Frontend SPA
    location / {
      root  /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;

      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      # Le build Vite n'utilise pas de script inline ; les styles le sont (styles JSX).
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }
  }
}
